<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gunfight UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HUD en haut au centre -->
    <div id="hud" class="hidden">
        <div class="side left">
            <div class="side-label"></div>
            <div class="side-value"></div>
            <div class="side-sub"></div>
        </div>
        <div class="center">
            <div class="title"></div>
            <div class="timer"></div>
            <div class="subtitle"></div>
            <div class="badge"></div>
        </div>
        <div class="side right">
            <div class="side-label"></div>
            <div class="side-value"></div>
            <div class="side-sub"></div>
        </div>
    </div>

    <!-- Kill feed en haut à droite -->
    <div id="killfeed"></div>

    <!-- Marqueur de touche + chiffres de dégâts (autour du viseur) -->
    <div id="crosshair">
        <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
        <div id="damage"></div>
    </div>

    <!-- Message de kill / multi-kill -->
    <div id="medal" class="hidden">
        <div class="m-title"></div>
        <div class="m-sub"></div>
    </div>

    <!-- Choix des armes (début de manche) -->
    <div id="loadout" class="hidden">
        <div class="lo-panel">
            <div class="lo-head">
                <div>
                    <div class="lo-title">Choisis tes armes</div>
                    <div class="lo-sub"></div>
                </div>
                <div class="lo-timer"></div>
            </div>
            <div class="lo-slots"></div>
            <div class="lo-grid"></div>
            <button class="lo-ok">Valider</button>
        </div>
    </div>

    <!-- Vie et kevlar (bas de l'écran, au centre) + objets de soin en dessous -->
    <div id="vitals" class="hidden">
        <div class="vrow health">
            <span class="val"></span>
            <div class="vcol">
                <div class="vlabel">
                    <svg class="vicon" viewBox="0 0 12 12"><path d="M4.5 0h3v4.5H12v3H7.5V12h-3V7.5H0v-3h4.5z"/></svg>VIE
                </div>
                <div class="vbar"><div class="fill"></div></div>
            </div>
        </div>
        <div class="vrow armour">
            <span class="val"></span>
            <div class="vcol">
                <div class="vlabel">
                    <svg class="vicon" viewBox="0 0 12 14"><path d="M6 0l6 2.2v4.6c0 3.4-2.5 6.1-6 7.2C2.5 12.9 0 10.2 0 6.8V2.2z"/></svg>KEVLAR
                </div>
                <div class="vbar"><div class="fill"></div></div>
            </div>
        </div>
        <div id="items" class="hidden"></div>
    </div>

    <!-- Annonces au centre de l'écran -->
    <div id="announce" class="hidden">
        <div class="a-title"></div>
        <div class="a-sub"></div>
    </div>

    <!-- Classement (touche Z maintenue) -->
    <div id="scoreboard" class="hidden">
        <div class="sb-title"></div>
        <table>
            <thead></thead>
            <tbody></tbody>
        </table>
        <div class="sb-empty">Rejoins un mode avec /attack ou /redzone</div>
    </div>

    <section id="match-results" class="hidden">
        <div class="results-panel">
            <div class="results-title"></div>
            <div class="results-score"></div>
            <div class="results-tables"></div>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
