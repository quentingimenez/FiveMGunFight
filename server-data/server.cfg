# =============================================================================
#  Configuration du serveur FiveM Gunfight
#  La clé de licence, le nom et le nombre de joueurs sont dans le fichier .env
#  (ils sont copiés automatiquement dans secrets.cfg au démarrage).
# =============================================================================

# Ports réseau
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Valeurs venant du fichier .env (clé, nom, joueurs max, admins)
exec secrets.cfg

# OneSync : toujours actif dans les builds récents (obligatoire au-delà de 32
# joueurs et pour les "routing buckets"). `set onesync on` est ignoré et produit
# l'avertissement "'onesync' is an internal ConVar and cannot be changed".

# Nom, description, tags et langue affichés dans la liste publique : gérés sur
# https://portal.cfx.re/ (les lignes sv_projectName / sv_projectDesc / sets tags
# / sets locale ne sont plus lues par FXServer pour l'annuaire public).
# load_server_icon logo.png   # image 96x96 à placer dans server-data

# Pas de scripts côté client non signés
sv_scriptHookAllowed 0

# Enlève le # devant la ligne suivante pour cacher le serveur de la liste publique
# sv_master1 ""

# ---------------------------------------------------------------- Ressources
# Ressources système (incluses dans FXServer)
# sessionmanager et hardcap n'existent plus dans les artifacts récents : les
# "ensure" de la doc officielle échouent désormais. Ne pas les remettre.
# Chat des joueurs et saisie des commandes avec la touche T ; les notifications restent dans gf_ui.
ensure chat
# txAdmin n'est pas une ressource à démarrer : en mode moniteur il est lancé par
# FXServer lui-même (ne pas ajouter "ensure monitor" ici, ça provoque une erreur).

# Ressources de base Cfx.re (dossier [cfx-default])
ensure mapmanager
ensure spawnmanager
ensure baseevents

# oxmysql : accès MariaDB (phase 2). À démarrer avant gf_db et gf_stats.
ensure oxmysql
# gf_db applique les migrations de schéma au démarrage avant les ressources qui lisent la base.
ensure gf_db
# gf_journal écrit les événements de match dans la table gf_match_events (après gf_db, avant gf_core).
ensure gf_journal

# Nos ressources gunfight (dossier [gunfight]) - l'ordre compte
ensure gf_thumbs
ensure gf_weapons
ensure gf_vehicles
ensure gf_ui
ensure gf_core
ensure gf_inventory
ensure gf_lobby
ensure gf_maps
ensure gf_attack
ensure gf_redzone
ensure gf_audit
ensure gf_stats
ensure gf_menu
ensure gf_admin

# ---------------------------------------------------------------- Permissions
# Les admins (déclarés dans .env -> ADMIN_IDENTIFIERS) ont tous les droits
add_ace group.admin command allow
add_ace group.admin gunfight.admin allow
