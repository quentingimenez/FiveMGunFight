# =============================================================================
#  Socle commun aux environnements. NE PAS LANCER SEUL.
#
#  Développement : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#  Production    : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#  Arrêt         : docker compose -f docker-compose.yml -f docker-compose.dev.yml down
#
#  start.bat / stop.bat / status.bat enveloppent déjà le fichier de dev.
# =============================================================================
# Fige le nom du projet Compose : les volumes restent gunfight_* quel que soit
# le nom du dossier de checkout (sinon Compose les préfixe avec ce nom de dossier).
name: gunfight
services:
  fxserver:
    container_name: gunfight-fxserver
    restart: unless-stopped
    # Plafond mémoire : protège la machine hôte d'une fuite mémoire du serveur.
    # Surchargeable dans .env (FXSERVER_MEMORY_LIMIT), 4g par défaut.
    mem_limit: ${FXSERVER_MEMORY_LIMIT:-4g}
    env_file: .env
    environment:
      # true (défaut) : FXServer démarre en "mode moniteur", c'est txAdmin qui
      # lance le serveur de jeu et qui fournit le panneau web (port 40120).
      # false : FXServer démarre directement avec server.cfg, sans txAdmin.
      TXADMIN: ${TXADMIN:-true}
      # Où txAdmin range ses données (comptes, config) : volume persistant
      TXHOST_DATA_PATH: /opt/fivem/txData
      TXHOST_TXA_PORT: "40120"
      TXHOST_INTERFACE: 0.0.0.0
      # Amorçage de maps.json dans un volume vide. Désactivé en dev (le dossier
      # du dépôt est monté), activé par docker-compose.prod.yml.
      GF_SEED_MAPS: "false"
    init: true
    stdin_open: true   # permet de taper des commandes avec console.bat
    tty: true
    ports:
      - "30120:30120/tcp"
      - "30120:30120/udp"
      # Panneau txAdmin : joignable uniquement depuis cette machine. Pour un accès
      # distant, passer par un tunnel SSH ou un reverse proxy TLS (pas configuré ici).
      - "127.0.0.1:40120:40120/tcp"
    healthcheck:
      # Le serveur répond en HTTP sur le port de jeu dès qu'il accepte des joueurs.
      # En mode moniteur, tant que txAdmin n'a pas été configuré, le conteneur
      # reste "unhealthy" : c'est attendu.
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:30120/dynamic.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      # Données de txAdmin (comptes admin, configuration) conservées entre les redémarrages
      - txdata:/opt/fivem/txData
    depends_on:
      mariadb:
        # n'attend pas seulement le conteneur : attend que la base accepte les connexions
        condition: service_healthy
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    # Digest figé : MariaDB 11.4 LTS, résolu le 2026-11-25. Dependabot propose
    # les mises à jour ; les montées majeures (11.8) restent manuelles.
    image: mariadb:11.4@sha256:a8992b5e5404d11e03c54a31d0c1bdea3fd116d283aa6d1a627551f29045309b
    container_name: gunfight-mariadb
    restart: unless-stopped
    # Plafond mémoire : protège la machine hôte d'une fuite mémoire. 2g couvre le
    # buffer pool InnoDB de 1G avec de la marge (voir docker/mariadb.cnf).
    # Surchargeable dans .env (MARIADB_MEMORY_LIMIT).
    mem_limit: ${MARIADB_MEMORY_LIMIT:-2g}
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      # met à jour les tables système quand l'image MariaDB est mise à jour
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - dbdata:/var/lib/mysql
      # réglages InnoDB / utf8mb4 / connexions (voir docker/mariadb.cnf)
      - ./docker/mariadb.cnf:/etc/mysql/conf.d/zz-gunfight.cnf:ro
      # scripts SQL exécutés uniquement au tout premier démarrage (volume vide)
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Pas de port exposé : la base n'est accessible que par le serveur FiveM

volumes:
  txdata:
  dbdata:
