# Configuration gitleaks du dépôt FiveMGunFight.
#
# Les règles par défaut de gitleaks restent actives : cette configuration ne
# désactive aucun détecteur. Il y a désormais deux exceptions, chacune
# justifiée et limitée aux fichiers concernés :
#   1. la valeur d'exemple « change_moi » citée par la documentation et les
#      tests ;
#   2. les noms d'armes GTA (clés WEAPON_*) des fichiers .meta des armes, que
#      generic-api-key prend pour des clés d'API alors qu'ils ne sont jamais des
#      secrets.
# Une exception qui combine des chemins et des motifs doit fixer
# condition = "AND" : sans cela, gitleaks combine paths et regexes en OU et
# ignorerait tout le contenu des fichiers visés. Toute nouvelle exception doit
# rester justifiée et limitée de la même façon, jamais élargie à tout le dépôt.

[extend]
useDefault = true

[[allowlists]]
description = "Valeur d'exemple change_moi (documentation et tests), jamais un secret réel"
paths = ['''^(?:docs/.*|tests/.*|\.env\.example)$''']
regexes = ['''change_moi''']

[[allowlists]]
description = "Noms d'armes GTA (clés WEAPON_*) dans les fichiers .meta des armes, pris pour des clés d'API par generic-api-key ; jamais un secret"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)server-data/resources/\[gunfight\]/gf_weapons/data/.*\.meta$''']
regexes = ['''^WEAPON_[A-Z0-9_]+$''']
