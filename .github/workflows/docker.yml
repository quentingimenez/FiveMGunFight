name: Docker

# Construit l'image à chaque envoi, la publie sur GitHub Container Registry,
# puis vérifie qu'elle démarre réellement avec toutes les ressources du serveur.
# Sur les pull requests, aucune image n'est publiée : le job smoke la construit
# localement, même sans secret. Un test statique sans licence (obligatoire)
# vérifie le refus de la valeur d'exemple ; le démarrage complet n'a lieu que si
# la clé CI est disponible. Une analyse Trivy bloque les PR sur les
# vulnérabilités corrigeables CRITICAL/HIGH.
#
# Le secret CFX_LICENSE_KEY doit être une clé CI dédiée, jamais la clé du
# serveur de production : seule la vérification de démarrage l'utilise. Les pull
# requests Dependabot (et celles venues d'un fork) n'ont pas accès aux secrets
# Actions : le démarrage complet est alors sauté avec une note, mais le test
# statique et la construction restent exécutés. Dans tous les autres cas, un
# secret absent fait échouer le job.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Relance hebdomadaire sur main, hors heures pleines (lundi 03:17 UTC).
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  image:
    name: Construire et publier l'image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Une construction par référence : on annule les runs PR obsolètes, jamais
    # un envoi sur main (l'image publiée doit rester la dernière du commit).
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sha court du commit construit : il entre dans l'image (argument
      # BUILD_SHA, convar gf_build_sha) et devient la version affichée par le
      # lobby. Le job smoke refait le même calcul pour son image locale.
      - name: Calculer le sha du build
        run: echo "BUILD_SHA=$(printf '%s' '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"

      # GHCR refuse une référence contenant des majuscules : on calcule une fois
      # pour toutes la version minuscule du nom du dépôt.
      - name: Calculer le nom d'image en minuscules
        run: |
          echo "IMAGE_LC=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Lire la version FXServer épinglée
        run: |
          set -euo pipefail
          if [ ! -f .fxserver-version ]; then
            echo "::error::.fxserver-version manquant"
            exit 1
          fi
          lire_cle() {
            grep -E "^${1}=" .fxserver-version | head -n 1 | cut -d= -f2-
          }
          FX_VERSION="$(lire_cle FX_VERSION)"
          FX_URL="$(lire_cle FX_URL)"
          FX_SHA256="$(lire_cle FX_SHA256)"
          if [ -z "$FX_VERSION" ] || [ -z "$FX_URL" ] || [ -z "$FX_SHA256" ]; then
            echo "::error::FX_VERSION, FX_URL et FX_SHA256 sont obligatoires dans .fxserver-version"
            exit 1
          fi
          if ! printf '%s' "$FX_VERSION" | grep -Eq '^[0-9]+$'; then
            echo "::error::FX_VERSION doit être un numéro de build"
            exit 1
          fi
          if ! printf '%s' "$FX_URL" | grep -Eq '^https://[^[:space:]]+$'; then
            echo "::error::FX_URL doit être une URL HTTPS sans espace"
            exit 1
          fi
          if ! printf '%s' "$FX_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::FX_SHA256 doit être une empreinte SHA256 en minuscules"
            exit 1
          fi
          {
            echo "FX_VERSION=$FX_VERSION"
            echo "FX_URL=$FX_URL"
            echo "FX_SHA256=$FX_SHA256"
          } >> "$GITHUB_ENV"
          echo "FXServer $FX_VERSION épinglé."

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_LC }}
          # L'étiquette ci-<sha long> est aussi utilisée par le job smoke.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=ci-

      # Sur PR, l'image est chargée localement pour Trivy et le smoke. Le
      # docker exporter de Buildx ne sait pas exporter d'attestations avec
      # --load : provenance et SBOM sont donc réservés aux images publiées.
      - name: Build et push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ env.BUILD_SHA }}
            FX_URL=${{ env.FX_URL }}
            FX_SHA256=${{ env.FX_SHA256 }}
          provenance: ${{ github.event_name == 'pull_request' && 'false' || 'mode=max' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le scan tourne sur l'image PR réellement construite. Une vulnérabilité
      # corrigeable CRITICAL/HIGH fait échouer le job.
      - name: Scanner l'image (Trivy)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LC }}:ci-${{ github.sha }}
          version: v0.76.2
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  smoke:
    name: Vérifier le démarrage des ressources
    needs: image
    # Pas de groupe de concurrence partagé entre références : GitHub n'y garde
    # qu'un run en attente et annule les autres (« higher priority waiting
    # request »), ce qui faisait perdre leur smoke à d'autres PR et à main.
    # Deux smoke de références différentes peuvent donc tourner en même temps
    # sur la clé CI, chacun sur sa propre machine GitHub (voir docs/qualite.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    # Par référence seulement : un nouvel envoi sur une PR remplace son smoke
    # obsolète ; ceux des autres PR et de main ne sont jamais touchés.
    concurrency:
      group: smoke-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CFX_LICENSE_KEY: ${{ secrets.CFX_LICENSE_KEY }}
      LOGS_SURS: "false"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calculer le sha du build
        run: echo "BUILD_SHA=$(printf '%s' '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Calculer le nom d'image en minuscules
        run: |
          echo "IMAGE_LC=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Lire la version FXServer épinglée
        run: |
          set -euo pipefail
          if [ ! -f .fxserver-version ]; then
            echo "::error::.fxserver-version manquant"
            exit 1
          fi
          lire_cle() {
            grep -E "^${1}=" .fxserver-version | head -n 1 | cut -d= -f2-
          }
          FX_VERSION="$(lire_cle FX_VERSION)"
          FX_URL="$(lire_cle FX_URL)"
          FX_SHA256="$(lire_cle FX_SHA256)"
          if [ -z "$FX_VERSION" ] || [ -z "$FX_URL" ] || [ -z "$FX_SHA256" ]; then
            echo "::error::FX_VERSION, FX_URL et FX_SHA256 sont obligatoires dans .fxserver-version"
            exit 1
          fi
          if ! printf '%s' "$FX_VERSION" | grep -Eq '^[0-9]+$'; then
            echo "::error::FX_VERSION doit être un numéro de build"
            exit 1
          fi
          if ! printf '%s' "$FX_URL" | grep -Eq '^https://[^[:space:]]+$'; then
            echo "::error::FX_URL doit être une URL HTTPS sans espace"
            exit 1
          fi
          if ! printf '%s' "$FX_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::FX_SHA256 doit être une empreinte SHA256 en minuscules"
            exit 1
          fi
          {
            echo "FX_VERSION=$FX_VERSION"
            echo "FX_URL=$FX_URL"
            echo "FX_SHA256=$FX_SHA256"
          } >> "$GITHUB_ENV"
          echo "FXServer $FX_VERSION épinglé."

      # Le runner ne reçoit jamais la clé sur une PR de fork ou de Dependabot :
      # seul ce cas saute le démarrage complet (le test statique reste
      # obligatoire). Partout ailleurs (push, PR interne, planification), une clé
      # absente fait échouer le job : le démarrage réel est un check bloquant.
      - name: Détecter la clé de licence CI
        env:
          ACTEUR: ${{ github.actor }}
          DEPOT_PR: ${{ github.event.pull_request.head.repo.full_name }}
          DEPOT: ${{ github.repository }}
        run: |
          if [ -n "${CFX_LICENSE_KEY:-}" ]; then
            echo "disponible=true" >> "$GITHUB_ENV"
          elif [ "$ACTEUR" = "dependabot[bot]" ] || { [ -n "$DEPOT_PR" ] && [ "$DEPOT_PR" != "$DEPOT" ]; }; then
            echo "::notice::PR de fork ou de Dependabot : pas d'accès au secret CFX_LICENSE_KEY, démarrage complet ignoré, test statique sans licence exécuté."
            echo "disponible=false" >> "$GITHUB_ENV"
          else
            echo "::error::Le secret CFX_LICENSE_KEY est absent : le démarrage réel est obligatoire hors PR de fork ou de Dependabot. Ajoute-le dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Même étiquette que celle publiée par le job image (metadata-action) :
      # ci-<sha long>, grâce à type=sha,format=long,prefix=ci-.
      - name: Construire l'image localement (pull request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker build \
            --tag "$IMAGE_LC:ci-${{ github.sha }}" \
            --build-arg "BUILD_SHA=$BUILD_SHA" \
            --build-arg "FX_URL=$FX_URL" \
            --build-arg "FX_SHA256=$FX_SHA256" \
            .

      - name: Connexion à GHCR (envoi, tag ou planification)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Récupérer l'image publiée (envoi, tag ou planification)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker pull "$IMAGE_LC:ci-${{ github.sha }}"

      # Check obligatoire qui fonctionne sans secret : l'entrypoint doit refuser
      # la valeur d'exemple et sortir en code 1. Le conteneur est conservé pour
      # que le nettoyage final le supprime même en cas d'échec.
      - name: Vérifier le refus de la licence d'exemple (sans secret)
        run: |
          set +e
          docker run --name smoke-static \
            -e LICENSE_KEY=change_moi \
            "$IMAGE_LC:ci-${{ github.sha }}" > smoke-static.log 2>&1
          statut=$?
          set -e
          cat smoke-static.log
          if [ "$statut" -ne 1 ]; then
            echo "::error::Le conteneur devait sortir en code 1 sans licence valide (obtenu : $statut)."
            exit 1
          fi
          if ! grep -q "LICENSE_KEY" smoke-static.log; then
            echo "::error::Le message d'erreur ne mentionne pas LICENSE_KEY."
            exit 1
          fi
          echo "Refus sans licence vérifié (code 1 et message LICENSE_KEY)."

      - name: Démarrer le serveur
        if: env.disponible == 'true'
        run: |
          set -euo pipefail
          # -i : FXServer interprète la fermeture de son entrée standard comme un
          # Ctrl-C et quitte aussitôt. Sans lui, un conteneur détaché démarre
          # puis s'arrête avant même d'avoir répondu.
          docker run -d --name smoke \
            --init \
            -i \
            --memory 4g \
            -p 30120:30120 \
            -e LICENSE_KEY="$CFX_LICENSE_KEY" \
            -e TXADMIN=false \
            -e SERVER_NAME="Gunfight CI" \
            -e MAX_PLAYERS=48 \
            -e MARIADB_DATABASE=gunfight \
            -e MARIADB_USER=gunfight \
            -e MARIADB_PASSWORD=ci_password \
            "$IMAGE_LC:ci-${{ github.sha }}"

      # On attend à la fois la réponse HTTP (le serveur accepte des joueurs) et
      # le démarrage de nos ressources. Sortie immédiate dès que les deux sont
      # vraies, sinon échec au bout de 180 secondes.
      - name: Attendre le démarrage
        if: env.disponible == 'true'
        run: |
          set -uo pipefail
          demarre=false
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' smoke 2>/dev/null || true)" != "true" ]; then
              echo "::error::Le conteneur smoke s'est arrêté avant de répondre."
              docker logs --tail 200 smoke || true
              exit 1
            fi
            if curl -fsS --max-time 2 "http://127.0.0.1:30120/dynamic.json" >/dev/null 2>&1 \
              && docker logs smoke 2>&1 | grep "Started resource gf_core" >/dev/null; then
              echo "Serveur démarré après $((i * 3)) s."
              demarre=true
              break
            fi
            sleep 3
          done
          if [ "$demarre" != "true" ]; then
            echo "::error::Le serveur n'a pas répondu dans les 180 secondes."
            docker logs --tail 200 smoke || true
            exit 1
          fi

      - name: Vérifier les journaux
        if: env.disponible == 'true'
        run: |
          set -euo pipefail
          docker logs smoke > smoke.log 2>&1 || true
          if grep -q "Could not authenticate server license key" smoke.log; then
            echo "::error::La clé de licence du secret CFX_LICENSE_KEY a été refusée par Cfx.re."
            exit 1
          fi
          # FXServer ajoute ses ressources système (chat, etc.) au total affiché :
          # ce total n'est pas le nombre de fxmanifest du dépôt. On vérifie donc
          # que le scan a eu lieu, puis que chaque ressource gunfight démarre.
          # Le smoke n'a pas de MariaDB : gf_db démarre et attend la base sans
          # appliquer de migration ; seul le démarrage des ressources est vérifié.
          if ! grep -qE "Found [0-9]+ resources" smoke.log; then
            echo "::error::Le serveur n'a pas scanné ses ressources."
            tail -n 200 smoke.log
            exit 1
          fi
          # La liste des ressources est construite depuis server.cfg (le smoke
          # s'exécute à la racine du dépôt) : aucune ressource ne doit être
          # oubliée ni vérifiée en double. Garde-fou : une liste vide est une
          # erreur, on ne laisse jamais la boucle passer à vide.
          ressources="$(awk '$1 == "ensure" && $2 ~ /^gf_/ { print $2 }' server-data/server.cfg)"
          if [ -z "$ressources" ]; then
            echo "::error::Aucune ressource gf_ trouvée dans server-data/server.cfg."
            exit 1
          fi
          for r in $ressources; do
            if ! grep -q "Started resource $r" smoke.log; then
              echo "::error::La ressource $r n'a pas démarré."
              tail -n 200 smoke.log
              exit 1
            fi
          done
          echo "Ressources scannées et ressources gunfight démarrées."

      # Même en échec : on rassemble les journaux, puis on vérifie qu'aucune
      # clé de licence n'y figure avant de publier l'artefact. Le grep ne
      # l'affiche jamais (sortie redirigée vers /dev/null).
      - name: Collecter les journaux
        if: always()
        run: |
          set -uo pipefail
          if docker inspect smoke >/dev/null 2>&1; then
            docker logs smoke > smoke.log 2>&1 || true
          else
            : > smoke.log
          fi
          touch smoke-static.log
          if [ -n "${CFX_LICENSE_KEY:-}" ]; then
            for fichier in smoke.log smoke-static.log; do
              if grep -Fq -- "$CFX_LICENSE_KEY" "$fichier"; then
                echo "::error::La clé de licence apparaît dans $fichier : artefact non publié."
                exit 1
              fi
            done
          fi
          echo "LOGS_SURS=true" >> "$GITHUB_ENV"

      - name: Publier les journaux
        if: always() && env.LOGS_SURS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journaux-smoke
          path: |
            smoke.log
            smoke-static.log
          retention-days: 7
          if-no-files-found: ignore

      # Même si une étape précédente a échoué : les conteneurs ne doivent pas
      # rester sur le runner, et leurs noms être libres au prochain run.
      - name: Nettoyer
        if: always()
        run: |
          docker rm -f smoke 2>/dev/null || true
          docker rm -f smoke-static 2>/dev/null || true
