name: Qualité

# Contrôles du dépôt : syntaxe, style, secrets, workflows et tests. Une seule
# commande, scripts/verifier-docker.sh, construit l'image docker/verifier et y
# lance scripts/verifier.sh. Les outils binaires y sont épinglés par version ET
# par empreinte SHA256, comme les actions le sont par leur SHA de commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

env:
  # Utilisées par le job « securite ». L'image de vérification duplique ces
  # valeurs en ARG (docker/verifier/Dockerfile) : tests/test_depot.py vérifie
  # qu'elles restent identiques.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  qualite:
    name: Qualité du dépôt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # L'image de vérification est construite par Buildx avec ses couches dans
      # le cache GitHub Actions (scope distinct de l'image FXServer de
      # docker.yml) : elle n'est reconstruite que si docker/verifier change.
      # Les pull requests lisent le cache rempli par main. Sur un cache
      # manquant, le miroir Azure d'Ubuntu remplace archive.ubuntu.com et
      # security.ubuntu.com, lents et parfois en cours de synchronisation.
      - name: Configurer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # load: true charge l'image dans le démon Docker du runner ; le docker
      # exporter ne sait pas exporter d'attestations, d'où provenance: false.
      - name: Construire l'image de vérification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/verifier
          file: docker/verifier/Dockerfile
          load: true
          tags: gunfight-verifier:ci
          provenance: false
          build-args: |
            APT_MIRROR=http://azure.archive.ubuntu.com/ubuntu
            APT_SECURITY_MIRROR=http://azure.archive.ubuntu.com/ubuntu
          cache-from: type=gha,scope=verifier
          cache-to: type=gha,scope=verifier,mode=max

      # Aucun outil n'est installé sur le runner : l'image de vérification les
      # fournit tous et scripts/verifier.sh échoue si l'un manque.
      # GF_VERIFIER_IMAGE réutilise l'image construite à l'étape précédente.
      - name: Vérifier le dépôt
        env:
          GF_VERIFIER_IMAGE: gunfight-verifier:ci
        run: bash scripts/verifier-docker.sh

  securite:
    name: Sécurité de l'historique
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Récupérer tout l'historique
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Installer gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks

      # --all couvre toutes les branches et tous les tags récupérés grâce à
      # fetch-depth: 0, pas seulement les commits du checkout de la PR.
      - name: Chercher des secrets dans l'historique (gitleaks)
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts=--all .
